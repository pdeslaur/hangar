<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Jellyfin</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
</style>
<script src="/sso/bridge.js"></script>
</head>
<body>
<p id="status">Signing in…</p>
<script>
jellyfinBridge.signIn().then(
	() => location.replace("/web/"),
	(e) => { document.getElementById("status").textContent = "Signing in failed: " + e.message; },
);
</script>
</body>
</html>
