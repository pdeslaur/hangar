<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Jellyfin</title>
    <link rel="stylesheet" href="/sso-static/style.css" />
    <script src="/sso-static/bridge.js"></script>
  </head>
  <body>
    <main class="status">
      {{- with .Session}}
      <p>Opening Jellyfin…</p>
      <script>
        jellyfinBridge.store({{.}});
        location.replace("/web/");
      </script>
      {{- else}}
      <p>Signing in failed: {{.Error}}</p>
      <p><a href="/sso/login">Try again</a></p>
      {{- end}}
    </main>
  </body>
</html>
