name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up base image fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # goolm is mautrix's olm in Go; without it, mautrix needs libolm and cgo.
    GOFLAGS: -tags=goolm

permissions:
    contents: read

# Each job keeps its own Go cache, since each compiles differently: lint for
# vet and staticcheck, test with -race, build for arm64 too. A job restores
# its newest cache and, on main, saves a new one every run, so the cache
# follows the code rather than go.sum. Pull requests only read main's caches.
jobs:
    # jellyfin-bridge's pages, built with Node for go:embed. Every job
    # compiling Go needs them, so this builds them once for the rest.
    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: internal/jellybridge/web
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: internal/jellybridge/web/package-lock.json

            - run: npm ci

            - run: npm run build

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: jellybridge-web
                  path: internal/jellybridge/web/dist
                  if-no-files-found: error
                  retention-days: 1

    lint:
        needs: web
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: jellybridge-web
                  path: internal/jellybridge/web/dist

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "${unformatted}" ]; then
                      echo "Not formatted with gofmt:"
                      echo "${unformatted}"
                      exit 1
                  fi

            - run: go mod tidy -diff

            - run: go vet ./...

            - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}

    # Runs tuwunel:latest, so holds no permission to publish.
    test:
        needs: web
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: jellybridge-web
                  path: internal/jellybridge/web/dist

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            # mautrix's OlmMachine caches its own cross-signing keys without a
            # lock, so a client that sends while it syncs races inside
            # mautrix. internal/relay runs without the race detector until
            # mautrix guards that cache.
            - run: |
                  go test -race $(go list ./... | grep -v '/internal/relay$')
                  go test ./internal/relay
              env:
                  # Also tests against a real tuwunel and Jellyfin, with docker.
                  TUWUNEL_IMAGE: ghcr.io/matrix-construct/tuwunel:latest
                  JELLYFIN_IMAGE: lscr.io/linuxserver/jellyfin:latest

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}

    build:
        needs: [web, lint, test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: jellybridge-web
                  path: internal/jellybridge/web/dist

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

            - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

            # Each command publishes to ghcr.io/<owner>/<its directory name>.
            # Without the commit stamped into the binaries, an image's digest
            # changes only when what it's built from does, and a digest this
            # workflow already signed isn't signed again.
            - name: Build and push
              if: github.event_name != 'pull_request'
              env:
                  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}
                  GOFLAGS: ${{ env.GOFLAGS }} -buildvcs=false
                  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yaml@${{ github.ref }}
              run: |
                  ko build --base-import-paths \
                      --tags latest \
                      --image-label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
                      $(go list ./cmd/...) >images.txt
                  # Each sign runs in its own process, with its own TUF cache
                  # in TUF_ROOT: cosigns sharing ~/.sigstore race to write its
                  # metadata, and one fails with "failed to persist metadata".
                  sign() {
                      TUF_ROOT=$(mktemp -d)
                      export TUF_ROOT
                      if cosign verify "$1" \
                              --certificate-identity "${IDENTITY}" \
                              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                              >/dev/null 2>&1; then
                          echo "Already signed: $1"
                          return
                      fi
                      cosign sign --yes --recursive "$1"
                  }
                  # Signs the images in parallel, failing if any fails.
                  pids=()
                  while read -r image; do
                      sign "${image}" &
                      pids+=($!)
                  done <images.txt
                  status=0
                  for pid in "${pids[@]}"; do
                      wait "${pid}" || status=1
                  done
                  exit "${status}"

            - name: Build only
              if: github.event_name == 'pull_request'
              run: ko build --local --platform=linux/amd64 --base-import-paths $(go list ./cmd/...)

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}
