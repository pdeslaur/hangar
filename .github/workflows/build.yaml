name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up base image fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # goolm is mautrix's olm in Go; without it, mautrix needs libolm and cgo.
    GOFLAGS: -tags=goolm

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "${unformatted}" ]; then
                      echo "Not formatted with gofmt:"
                      echo "${unformatted}"
                      exit 1
                  fi

            - run: go mod tidy -diff

            - run: go vet ./...

            - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    # Runs tuwunel:latest, so holds no permission to publish.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            # mautrix's OlmMachine caches its own cross-signing keys without a
            # lock, so a client that sends while it syncs races inside
            # mautrix. internal/relay runs without the race detector until
            # mautrix guards that cache.
            - run: |
                  go test -race $(go list ./... | grep -v '/internal/relay$')
                  go test ./internal/relay
              env:
                  # Also tests against a real tuwunel, with docker.
                  TUWUNEL_IMAGE: ghcr.io/matrix-construct/tuwunel:latest

    build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Each command publishes to ghcr.io/<owner>/<its directory name>.
            # Without the commit stamped into the binaries, an image's digest
            # changes only when what it's built from does, and a digest this
            # workflow already signed isn't signed again.
            - name: Build and push
              if: github.event_name != 'pull_request'
              env:
                  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}
                  GOFLAGS: ${{ env.GOFLAGS }} -buildvcs=false
                  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yaml@${{ github.ref }}
              run: |
                  ko build --base-import-paths \
                      --tags latest \
                      --image-label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
                      $(go list ./cmd/...) >images.txt
                  while read -r image; do
                      if cosign verify "${image}" \
                              --certificate-identity "${IDENTITY}" \
                              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                              >/dev/null 2>&1; then
                          echo "Already signed: ${image}"
                          continue
                      fi
                      cosign sign --yes --recursive "${image}"
                  done <images.txt

            - name: Build only
              if: github.event_name == 'pull_request'
              run: ko build --local --platform=linux/amd64 --base-import-paths $(go list ./cmd/...)
