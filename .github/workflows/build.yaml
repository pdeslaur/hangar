name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up base image fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # goolm is mautrix's olm in Go; without it, mautrix needs libolm and cgo.
    GOFLAGS: -tags=goolm

permissions:
    contents: read

jobs:
    # Runs tuwunel:latest, so holds no permission to publish.
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - run: go test ./...
              env:
                  # Also tests against a real tuwunel, with docker.
                  TUWUNEL_IMAGE: ghcr.io/matrix-construct/tuwunel:latest

            - run: go vet ./...

            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

            - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

            # Each command publishes to ghcr.io/<owner>/<its directory name>.
            - name: Build and push
              if: github.event_name != 'pull_request'
              env:
                  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}
              run: |
                  ko build --base-import-paths \
                      --tags latest,$(git rev-parse --short HEAD) \
                      --image-label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
                      $(go list ./cmd/...) >images.txt
                  while read -r image; do
                      cosign sign --yes --recursive "${image}"
                  done <images.txt

            - name: Build only
              if: github.event_name == 'pull_request'
              run: ko build --local --platform=linux/amd64 --base-import-paths $(go list ./cmd/...)
