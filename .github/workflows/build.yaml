name: Build

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Daily rebuild to pick up base image fixes.
        - cron: "0 7 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # goolm is mautrix's olm in Go; without it, mautrix needs libolm and cgo.
    GOFLAGS: -tags=goolm

permissions:
    contents: read

# Each job keeps its own Go cache, saved only on main.
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "${unformatted}" ]; then
                      echo "Not formatted with gofmt:"
                      echo "${unformatted}"
                      exit 1
                  fi

            - run: go mod tidy -diff

            - run: go vet ./...

            - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

            # gopls check always exits zero.
            - name: gopls check
              run: |
                  diagnostics=$(go run golang.org/x/tools/gopls@v0.24.0 check $(git ls-files '*.go'))
                  if [ -n "${diagnostics}" ]; then
                      echo "${diagnostics}"
                      exit 1
                  fi

            - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            # internal/relay skips -race: mautrix's OlmMachine races on its
            # cross-signing key cache.
            - run: |
                  go test -race $(go list ./... | grep -v '/internal/relay$')
                  go test ./internal/relay
              env:
                  TUWUNEL_IMAGE: ghcr.io/matrix-construct/tuwunel:latest
                  JELLYFIN_IMAGE: lscr.io/linuxserver/jellyfin:latest
                  HOMEASSISTANT_IMAGE: ghcr.io/home-assistant/home-assistant:stable

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}

    build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - id: go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: false

            - id: cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
                      go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

            - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

            - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

            # Lists the commands depending on a package changed since BASE.
            # Kept outside the checkout, or ko warns the tree is dirty.
            - name: Select commands
              env:
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  go list ./cmd/... >"${RUNNER_TEMP}/commands.txt"
                  if [ -z "${BASE}" ] || ! git fetch --quiet --depth=1 origin "${BASE}"; then
                      echo "No base to compare with: building every command."
                      exit 0
                  fi
                  changed=$(git diff --name-only "${BASE}" HEAD | grep -v '_test\.go$' || true)
                  if grep -qxE 'go\.mod|go\.sum|\.ko\.yaml|\.github/workflows/build\.yaml' <<<"${changed}"; then
                      echo "The build changed: building every command."
                      exit 0
                  fi
                  root=$(pwd)
                  for command in $(cat "${RUNNER_TEMP}/commands.txt"); do
                      dirs=$(go list -deps -f '{{with .Module}}{{if .Main}}{{$.Dir}}{{end}}{{end}}' "${command}" | sed "s|^${root}/||")
                      for dir in ${dirs}; do
                          if grep -q "^${dir}/" <<<"${changed}"; then
                              echo "${command}"
                              break
                          fi
                      done
                  done >"${RUNNER_TEMP}/selected.txt"
                  mv "${RUNNER_TEMP}/selected.txt" "${RUNNER_TEMP}/commands.txt"
                  echo "Building:"
                  cat "${RUNNER_TEMP}/commands.txt"

            # -buildvcs=false keeps digests stable across commits, so an
            # unchanged image isn't signed again.
            - name: Build and push
              if: github.event_name != 'pull_request'
              env:
                  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}
                  GOFLAGS: ${{ env.GOFLAGS }} -buildvcs=false
                  IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yaml@${{ github.ref }}
                  SOURCE: https://github.com/${{ github.repository }}
              run: |
                  # Parallel cosigns sharing ~/.sigstore race on its metadata.
                  sign() {
                      TUF_ROOT=$(mktemp -d)
                      export TUF_ROOT
                      if cosign verify "$1" \
                              --certificate-identity "${IDENTITY}" \
                              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                              >/dev/null 2>&1; then
                          echo "Already signed: $1"
                          return
                      fi
                      cosign sign --yes --recursive "$1"
                  }
                  publish() {
                      image=$(ko build --base-import-paths \
                          --tags latest \
                          --image-label "org.opencontainers.image.source=${SOURCE}" \
                          "$1") || return
                      sign "${image}"
                  }
                  pids=()
                  while read -r command; do
                      publish "${command}" &
                      pids+=($!)
                  done <"${RUNNER_TEMP}/commands.txt"
                  status=0
                  for pid in "${pids[@]}"; do
                      wait "${pid}" || status=1
                  done
                  exit "${status}"

            - name: Build only
              if: github.event_name == 'pull_request'
              run: |
                  if [ -s "${RUNNER_TEMP}/commands.txt" ]; then
                      xargs --max-procs=0 --max-args=1 ko build --local --platform=linux/amd64 --base-import-paths <"${RUNNER_TEMP}/commands.txt"
                  fi

            - if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: ${{ steps.cache.outputs.cache-primary-key }}
