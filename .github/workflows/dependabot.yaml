name: Dependabot

# Enables auto-merge on Dependabot's pull requests, so that they merge once the
# required checks pass.
#
# Auto-merge is enabled with an octo-sts token rather than GITHUB_TOKEN, since
# a merge by GITHUB_TOKEN doesn't trigger the build that publishes the images.
# The .github/chainguard/dependabot.sts.yaml trust policy grants it
# contents: write and pull_requests: write.
#
# pull_request_target runs this workflow as it is on main, never a pull
# request's copy, which the trust policy requires. It never checks out the
# pull request's code.

on:
    pull_request_target:
        types: [opened, reopened, synchronize]

permissions: {}

jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            id-token: write # for octo-sts
        steps:
            - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
              id: octo-sts
              with:
                  scope: ${{ github.repository }}
                  identity: dependabot

            - name: Enable auto-merge
              env:
                  GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --squash "$PR_URL"
