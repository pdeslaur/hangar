version: 2
updates:
    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly
      groups:
          go:
              patterns: ["*"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]

    # jellyfin-bridge's pages.
    - package-ecosystem: npm
      directory: /internal/jellybridge/web
      schedule:
          interval: weekly
      groups:
          web:
              patterns: ["*"]
