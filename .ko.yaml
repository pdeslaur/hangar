defaultBaseImage: cgr.dev/chainguard/static:latest
defaultPlatforms:
    - linux/amd64
    - linux/arm64
builds:
    - id: matrix-relay
      main: ./cmd/matrix-relay
      # goolm is mautrix's olm in Go; without it, mautrix needs libolm and
      # cgo.
      flags:
          - -tags=goolm
baseImageOverrides:
    # The wrapper execs cloudflared, from its own image.
    github.com/pdeslaur/hangar/cmd/cloudflared-svid: docker.io/cloudflare/cloudflared:latest
